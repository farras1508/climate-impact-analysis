# Step 3.2 data-quality rules (DEC-064).
# Every threshold and range is fixed here BEFORE any score is computed, so a score cannot be
# tuned after seeing it. Changing a value after the first run = a decision-log entry.
#
# Windows (resolved from config.yaml): study = 1961-2025, h1b = 1880-2025, h2 = 1959-2025,
# h4_all = 1980-2025 (earliest H4 sensitivity start). Completeness and timeliness are judged
# inside the window; validity and uniqueness on every row read (a bad value is bad in any year).

scoring:
  completeness_gap_pct: {good: 1.0, acceptable: 5.0}        # internal gaps, % of observed span
  validity_out_of_range_pct: {good: 0.0, acceptable: 0.1}   # % of checked values, inside window
  timeliness_years_short: {good: 0, acceptable: 1}          # study_end - effective_end
  panel_reporting_share: 0.90                               # DEC-037
  panel_reference_years: 5                                  # median of the 5 preceding years

tables:
  gistemp_v4_global_monthly/monthly:
    window: h1b
    effective_end: {method: complete_years}
    ranges: {anomaly: [-2.5, 3.0]}

  hadcrut5_global_monthly/monthly:
    window: h1b
    effective_end: {method: complete_years}
    ranges: {anomaly: [-2.5, 3.0], lower_2p5: [-3.5, 3.0], upper_97p5: [-2.5, 4.0]}

  berkeley_global_monthly/air_over_sea_ice:
    window: h1b
    effective_end: {method: complete_years}
    ranges: {anomaly: [-2.5, 3.0], uncertainty: [0.0, 2.0]}

  berkeley_global_monthly/water_under_sea_ice:
    window: h1b
    effective_end: {method: complete_years}
    ranges: {anomaly: [-2.5, 3.0], uncertainty: [0.0, 2.0]}

  berkeley_country_monthly/monthly:
    window: study
    # DV2: the replication covers files reaching 2020; share judged among those countries
    effective_end: {method: panel_monthly, scope_year: 2020}
    # Monthly country anomalies: high-latitude winter months can exceed +-10 degC, so the
    # data dictionary's -6..6 (written for annual means) is too tight for monthly data.
    ranges: {anomaly: [-15.0, 15.0], uncertainty: [0.0, 10.0]}

  berkeley_country_monthly/file_headers:
    uniqueness_only: true

  noaa_co2_mlo_monthly/monthly:
    window: h2
    effective_end: {method: complete_years}
    ranges:
      average: [300.0, 500.0]
      deseasonalized: [300.0, 500.0]
      ndays: [0, 31]
      sdev: [0.0, 5.0]
      unc: [0.0, 5.0]

  noaa_oni/monthly:
    window: h2
    effective_end: {method: complete_years}
    ranges: {ANOM: [-3.5, 3.5], TOTAL: [20.0, 32.0]}

  owid_co2/country_year:
    window: study
    aggregates: owid
    value: co2
    effective_end: {method: panel_annual}
    ranges: {co2: [0.0, 50000.0], co2_per_capita: [0.0, 100.0], population: [0.0, 2.0e+9]}

  faostat_crops_livestock/production:
    window: study
    aggregates: faostat
    include_values: {Item Code: "@crops", Element Code: "@faostat_elements"}
    series: [Item Code, Element Code]
    value: Value
    effective_end: {method: panel_annual, by: Element Code}
    ranges_by:
      column: Value
      by: Element Code
      ranges:
        "5312": [0.0, 1.0e+9]       # area harvested, ha
        "5510": [0.0, 2.0e+9]       # production, t
        "5412": [1.0, 30000.0]     # yield, kg/ha
        "5419": [10.0, 300000.0]   # yield, hg/ha (legacy element)

  wdi/indicators:
    window: study
    aggregates: wdi
    series: [Indicator Code]
    value: value
    effective_end: {method: panel_annual, by: Indicator Code}
    ranges_by:
      column: value
      by: Indicator Code
      ranges:
        SP.POP.TOTL: [1000.0, 2.0e+9]
        NY.GDP.PCAP.PP.KD: [100.0, 250000.0]
        NV.AGR.TOTL.ZS: [0.0, 100.0]
        SP.URB.TOTL.IN.ZS: [0.0, 100.0]
        AG.LND.TOTL.K2: [0.1, 2.0e+7]

  wdi/country_classification:
    uniqueness_only: true

  emdat/events:
    window: h4_all
    effective_end: {method: events}
    completeness:
      method: events
      columns: [ISO, Start Year, Disaster Subgroup, Total Deaths, Total Affected]
    ranges:
      Start Year: [1900, 2026]
      Start Month: [1, 12]
      Total Deaths: [0, 5.0e+6]
      Total Affected: [0, 2.0e+9]

  nd_gain/vulnerability:
    window: [1995, 2025]
    effective_end: {method: panel_annual}
    ranges: {value: [0.0, 1.0]}

  nd_gain/readiness:
    window: [1995, 2025]
    effective_end: {method: panel_annual}
    ranges: {value: [0.0, 1.0]}

# ERA5 is scored from reports/profiling/profile.json (no second 2 GB scan).
era5:
  ranges: {t2m: [183.15, 333.15], tp: [0.0, null]}   # K (-90..+60 degC); m/day, >= 0

# ---------------------------------------------------------------- Step 3.2b (DEC-065)
crosschecks:
  integrity_invalid_pct: {good: 0.0, acceptable: 2.0}       # unknown codes, % of a dataset's codes
  yield_identity_pct: {good: 1.0, acceptable: 5.0}          # % of triples with |rel. diff| > tolerance
  yield_identity_tolerance: 0.01                            # production / area vs reported yield
  blank_flag_pct: {good: 0.0, acceptable: 1.0}              # % of blank values without flag M
  emdat_late_entry_pct: {good: 5.0, acceptable: 10.0}       # expected share of last-year events not yet entered
  emdat_mature_years: [2015, 2023]                          # years whose entry history is complete
  # ISO 3166-3 codes of former countries (EM-DAT, OWID); classified as historical, not invalid
  historical_codes:
    SUN: Soviet Union
    YUG: Yugoslavia (SFR)
    CSK: Czechoslovakia
    DDR: German Democratic Republic
    DEW: West Germany
    YMD: South Yemen
    YMN: North Yemen (former code)
    SCG: Serbia and Montenegro
    ANT: Netherlands Antilles
    VDR: North Vietnam
    ZAR: Zaire
    TMP: East Timor (former code)
    ROM: Romania (former code)
  required_values:
    emdat/events: {Disaster Subgroup: [Hydrological, Meteorological, Climatological, Geophysical]}
    faostat_crops_livestock/production: {Item Code: "@crops", Element Code: [5312, 5510, 5412]}

# ---------------------------------------------------------------- Step 3.3 (DEC-072)
domain:
  # An anomaly series averages ~0 over its own reference period: this tests the declared
  # baseline empirically instead of trusting documentation.
  baseline_tolerance_degc: 0.02
  rebase_period: [1991, 2020]                 # DEC-009: needs 360 valid months per series
  baselines:                                  # dataset/table: declared native reference period
    gistemp_v4_global_monthly/monthly: [1951, 1980]
    hadcrut5_global_monthly/monthly: [1961, 1990]
    berkeley_global_monthly/air_over_sea_ice: [1951, 1980]
    berkeley_global_monthly/water_under_sea_ice: [1951, 1980]
    berkeley_country_monthly/monthly: [1951, 1980]   # stated in every file header
  # Predecessor -> successor states (risk RD3). Codes: ISO3 / ISO 3166-3, or "FAO:<area code>".
  # `ended` = last year the predecessor existed as one statistical unit (FAOSTAT convention:
  # Belgium-Luxembourg reported jointly to 1999). Successor values up to `ended` are back-casts.
  successions:
    USSR:
      ended: 1991                              # last year of the predecessor
      predecessors: [SUN, "FAO:228"]
      successors: [ARM, AZE, BLR, EST, GEO, KAZ, KGZ, LTU, LVA, MDA, RUS, TJK, TKM, UKR, UZB]
    Yugoslavia:
      ended: 1991                              # last year of the predecessor
      predecessors: [YUG, "FAO:248"]
      successors: [BIH, HRV, MKD, SVN, SCG, SRB, MNE, XKX]
    Serbia and Montenegro:
      ended: 2005                              # last year of the predecessor
      predecessors: [SCG, "FAO:186"]
      successors: [SRB, MNE, XKX]
    Czechoslovakia:
      ended: 1992                              # last year of the predecessor
      predecessors: [CSK, "FAO:51"]
      successors: [CZE, SVK]
    Ethiopia PDR:
      ended: 1992                              # last year of the predecessor
      predecessors: ["FAO:62"]
      successors: [ETH, ERI]
    Sudan (former):
      ended: 2011                              # last year of the predecessor
      predecessors: ["FAO:206"]
      successors: [SDN, SSD]
    Belgium-Luxembourg:
      ended: 1999                              # last year of the predecessor
      predecessors: ["FAO:15"]
      successors: [BEL, LUX]
    Germany:
      ended: 1990                              # last year of the predecessor
      predecessors: [DDR, DFR, DEW]
      successors: [DEU]
    Yemen:
      ended: 1990                              # last year of the predecessor
      predecessors: [YMD, YMN]
      successors: [YEM]
    Netherlands Antilles:
      ended: 2010                              # last year of the predecessor
      predecessors: [ANT]
      successors: [CUW, SXM, BES]
  # Outcome blinding (DEC-072): Phase 3 tabulates data-generation features only. Climate-related
  # EM-DAT subgroup counts and yield levels are NOT tabulated before Phase 6.
  emdat_reporting_subgroup: Geophysical       # placebo subgroup = reporting-effort proxy
  faostat_flag_elements: [5412, 5510, 5312]

# ---------------------------------------------------------------- Step 3.4 (DEC-076)
missingness:
  # Each block = one variable as an analysis will use it. Grid = universe (217 WDI economies)
  # x years, restricted to years in which the country exists as a territorially constant unit
  # (DEC-074). Outcome = 1 if the value is missing. Values themselves are never read (blinding).
  covariates: [income, region, log_pop, year]   # GDP per capita is itself a tested variable,
                                                # so income group stands in for it (no circularity)
  separation_abs_coef: 15.0                     # |logit coef| above this = quasi-complete separation
  multiple_testing: holm                        # within each model's family of terms (FWER)
  variables:
    h3_yield:
      source: faostat
      element: 5412
      window: [1961, 2024]                      # DEC-066 effective end
      scope: growers                            # country-crop pairs with >= 1 observed yield
    h4_population:
      source: wdi
      indicator: SP.POP.TOTL
      window: [1989, 2024]                      # H4 1990-2025 with 1-year-lagged controls
    h4_gdp_pc_ppp:
      source: wdi
      indicator: NY.GDP.PCAP.PP.KD
      window: [1989, 2024]
    h5_agri_share:
      source: wdi
      indicator: NV.AGR.TOTL.ZS
      window: [2015, 2024]                      # H5: 10-year mean, >= 5 valid years (DEC-070)
      min_valid: 5
    h5_vulnerability:
      source: nd_gain
      table: vulnerability
      year: 2024
    h5_readiness:
      source: nd_gain
      table: readiness
      year: 2024
