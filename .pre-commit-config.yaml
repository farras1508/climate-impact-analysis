# Runs automatically on `git commit`. Manual run: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict        # Windows vs Linux filename clashes
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key         # e.g. a stray API key file

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout                 # notebook outputs never enter git

  - repo: local
    hooks:
      - id: forbid-data-files
        name: forbid committing data layers
        entry: "Data files must not be committed: raw data is immutable and tracked by manifest."
        language: fail
        files: ^data/(raw|interim|processed)/
        exclude: (\.gitkeep|manifest\.json)$

      - id: mypy
        name: mypy (src)
        entry: python -m mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
